protocol_version = "1.0"
call_timeout_seconds = 30
max_attempts = 2
max_actions = 100

[observability]
# Zero disables age-based retention selection; cleanup always requires --apply.
retention_days = 0
export_max_bytes = 16777216

[intake]
timeout_seconds = 300

[environment]
command_timeout_seconds = 10

[device]
install_timeout_seconds = 900
operation_timeout_seconds = 120
reserve_bytes = 1073741824

[storage]
reserve_bytes = 2147483648
overhead_bytes_per_apk = 16777216
safety_margin_percent = 10

[preprocessing]
download_workers = 5
request_timeout_seconds = 30
apk_timeout_seconds = 0
batch_timeout_seconds = 0
max_attempts = 0
retry_max_seconds = 300
max_apk_bytes = 8589934592

[codex]
executable = "codex"
version = "0.163.0"
timeout_seconds = 180
model = "gpt-6-luna"
reasoning_effort = "medium"

[gameplay]
# Planning calls per gameplay invocation; zero disables this limit.
max_turns = 0
no_progress_rounds = 24
no_progress_seconds = 900
evidence_budget_bytes = 4294967296
reserve_bytes = 2147483648

[workflow]
stages = ["preprocess", "environment", "prepare", "launch", "play", "report"]
