protocol_version = "1.0"
call_timeout_seconds = 30
max_attempts = 2
max_actions = 100

[observability]
# Zero disables age-based retention selection; cleanup always requires --apply.
retention_days = 0
export_max_bytes = 16777216

[intake]
timeout_seconds = 300

[environment]
command_timeout_seconds = 10

[device]
install_timeout_seconds = 900
operation_timeout_seconds = 120
reserve_bytes = 1073741824

[storage]
reserve_bytes = 2147483648
overhead_bytes_per_apk = 16777216
safety_margin_percent = 10

[preprocessing]
download_workers = 5
request_timeout_seconds = 30
apk_timeout_seconds = 0
batch_timeout_seconds = 0
max_attempts = 0
retry_max_seconds = 300
max_apk_bytes = 8589934592

[codex]
executable = "codex"
timeout_seconds = 180
model = "gpt-6-luna"
reasoning_effort = "medium"

[gameplay]
# Planning calls per gameplay invocation; zero disables this limit.
max_turns = 0
no_progress_rounds = 24
no_progress_seconds = 900
# Kernel-owned recovery rounds per exploration target; counts survive resume.
supervisor_recovery_rounds = 2
evidence_budget_bytes = 4294967296
reserve_bytes = 2147483648

# Agent IDs are routing names. Assign each job title to exactly one agent.
[gameplay.agents.agent_tom]
job_title = "Test Lead"
describ = "Own the test goal and propose the next bounded workflow step."
model = "gpt-6-luna"
reasoning_effort = "medium"

[gameplay.agents.agent_ray]
job_title = "Evidence Judge"
describ = "Independently verify outcomes against recorded evidence."
model = "gpt-6-luna"
reasoning_effort = "medium"

[gameplay.agents.agent_mia]
job_title = "Interface Specialist"
describ = "Identify visible controls and interface states."
model = "gpt-6-luna"
reasoning_effort = "medium"

[gameplay.agents.agent_lee]
job_title = "Exploration Specialist"
describ = "Find visible candidates for exploration."
model = "gpt-6-luna"
reasoning_effort = "medium"

[gameplay.agents.agent_zoe]
job_title = "Comparison Specialist"
describ = "Compare supplied before and after observations."
model = "gpt-6-luna"
reasoning_effort = "medium"

[workflow]
# Wall-clock limit for the entire workflow or a standalone play execution.
total_timeout_seconds = 3600
stages = ["preprocess", "environment", "prepare", "launch", "play", "report"]
