[project]
name = "game-automation"
version = "0.1.0"
description = "Evidence-first game test workflow, skills and process plugins"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
game-auto = "game_automation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game_automation"]

[dependency-groups]
dev = ["ruff>=0.9,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I"]
