[project]
name = "game-automation"
version = "0.1.0"
description = "Evidence-first game test workflow, skills and process plugins"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
game-auto = "game_automation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game_automation"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=var/pytest"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
